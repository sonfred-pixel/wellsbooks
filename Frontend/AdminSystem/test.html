<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Compact Dashboard</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <style>
    :root {
      --primary-color: #4361ee;
      --secondary-color: #3f37c9;
      --dark-color: #2b2d42;
      --light-color: #f8f9fa;
      --gray-color: #adb5bd;
      --sidebar-width: 200px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #f5f7fa;
      color: var(--dark-color);
      display: flex;
      min-height: 100vh;
    }

    /* Sidebar Styles */
    .sidebar {
      width: var(--sidebar-width);
      background-color: white;
      box-shadow: 2px 0 10px rgba(0, 0, 0, 0.1);
      display: flex;
      flex-direction: column;
    }

    .sidebar-header {
      padding: 20px;
      border-bottom: 1px solid #eee;
      text-align: center;
    }

    .sidebar-header h2 {
      color: var(--primary-color);
    }

    .sidebar-nav {
      flex: 1;
      padding: 20px 0;
    }

    .sidebar-nav ul {
      list-style: none;
    }

    .sidebar-nav li {
      margin-bottom: 5px;
    }

    .sidebar-nav a {
      display: block;
      padding: 10px 20px;
      color: var(--dark-color);
      text-decoration: none;
      transition: all 0.3s ease;
    }

    .sidebar-nav a:hover {
      background-color: #f0f2f5;
      color: var(--primary-color);
    }

    .sidebar-nav a i {
      margin-right: 10px;
      width: 20px;
      text-align: center;
    }

    .sidebar-nav .active a {
      background-color: rgba(67, 97, 238, 0.1);
      color: var(--primary-color);
      border-left: 3px solid var(--primary-color);
    }

    /* Main Content Styles */
    .main-content {
      flex: 1;
      padding: 20px;
    }

    .main-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .header-left h1 {
      font-size: 1.5rem;
    }

    .last-updated {
      font-size: 0.8rem;
      color: var(--gray-color);
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .search-box {
      position: relative;
    }

    .search-box input {
      padding: 8px 15px 8px 35px;
      border: 1px solid #ddd;
      border-radius: 5px;
      width: 200px;
    }

    .search-box i {
      position: absolute;
      left: 10px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--gray-color);
    }

    /* Stats Grid */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
      margin-bottom: 20px;
    }

    /* Stat Cards */
    .stat-card {
      background-color: white;
      border-radius: 8px;
      padding: 15px;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .stat-icon {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background-color: rgba(67, 97, 238, 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--primary-color);
      font-size: 1rem;
    }

    .stat-info h3 {
      font-size: 0.8rem;
      color: var(--gray-color);
      margin-bottom: 3px;
    }

    .stat-info p {
      font-size: 1.2rem;
      font-weight: 700;
      margin-bottom: 3px;
    }

    .stat-trend {
      font-size: 0.7rem;
      display: inline-flex;
      align-items: center;
      gap: 2px;
    }

    .stat-trend.up {
      color: #2ecc71;
    }

    .stat-trend.down {
      color: #e74c3c;
    }

    /* Chart Container */
    .chart-container {
      background-color: white;
      border-radius: 8px;
      padding: 15px;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
      margin-bottom: 20px;
      height: 300px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--gray-color);
    }

    /* Activities Container */
    .activities-container {
      background-color: white;
      border-radius: 8px;
      padding: 15px;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
    }

    .activities-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }

    #activities-list {
      list-style: none;
    }

    #activities-list li {
      padding: 10px 0;
      border-bottom: 1px solid #eee;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    #activities-list li:last-child {
      border-bottom: none;
    }

    /* Responsive Design */
    @media (max-width: 768px) {
      body {
        flex-direction: column;
      }
      
      .sidebar {
        width: 100%;
        flex-direction: row;
        padding: 10px;
      }
      
      .sidebar-header {
        display: none;
      }
      
      .sidebar-nav {
        width: 100%;
      }
      
      .sidebar-nav ul {
        display: flex;
        justify-content: space-around;
      }
      
      .sidebar-nav li {
        margin-bottom: 0;
      }
      
      .sidebar-nav a {
        padding: 10px;
        display: flex;
        flex-direction: column;
        align-items: center;
        font-size: 0.7rem;
      }
      
      .sidebar-nav a i {
        margin-right: 0;
        margin-bottom: 5px;
      }
      
      .sidebar-nav .active a {
        border-left: none;
        border-bottom: 3px solid var(--primary-color);
      }
      
      .search-box input {
        width: 150px;
      }
    }
  </style>
</head>
<body>
  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <h2><i class="fas fa-chart-line"></i> Dashboard</h2>
    </div>
    <nav class="sidebar-nav">
      <ul>
        <li class="active"><a href="#"><i class="fas fa-home"></i> Overview</a></li>
        <li><a href="#"><i class="fas fa-chart-bar"></i> Analytics</a></li>
        <li><a href="#"><i class="fas fa-users"></i> Users</a></li>
        <li><a href="#"><i class="fas fa-cog"></i> Settings</a></li>
      </ul>
    </nav>
  </aside>

  <!-- Main Content -->
  <main class="main-content">
    <header class="main-header">
      <div class="header-left">
        <h1>Dashboard Overview</h1>
        <p class="last-updated">Last updated: <span id="update-time">Loading...</span></p>
      </div>
      <div class="header-right">
        <div class="search-box">
          <input type="text" placeholder="Search...">
          <i class="fas fa-search"></i>
        </div>
      </div>
    </header>

    <!-- Stats Cards -->
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-icon">
          <i class="fas fa-users"></i>
        </div>
        <div class="stat-info">
          <h3>Total Users</h3>
          <p id="user-count">0</p>
          <span class="stat-trend up"><i class="fas fa-arrow-up"></i> 12%</span>
        </div>
      </div>

      <div class="stat-card">
        <div class="stat-icon">
          <i class="fas fa-shopping-cart"></i>
        </div>
        <div class="stat-info">
          <h3>Total Sales</h3>
          <p id="sales-count">0</p>
          <span class="stat-trend up"><i class="fas fa-arrow-up"></i> 8%</span>
        </div>
      </div>

      <div class="stat-card">
        <div class="stat-icon">
          <i class="fas fa-dollar-sign"></i>
        </div>
        <div class="stat-info">
          <h3>Revenue</h3>
          <p id="revenue-amount">$0</p>
          <span class="stat-trend down"><i class="fas fa-arrow-down"></i> 3%</span>
        </div>
      </div>
    </div>

    <!-- Chart Container -->
    <div class="chart-container">
      <p>Performance chart will be displayed here</p>
    </div>

    <!-- Activities Container -->
    <div class="activities-container">
      <div class="activities-header">
        <h2>Recent Activities</h2>
      </div>
      <ul id="activities-list"></ul>
    </div>
  </main>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
      // Initialize dashboard
      updateTime();
      updateDashboardData();
      
      // Update time every second
      setInterval(updateTime, 1000);
      
      // Simulate data updates every 5 seconds
      setInterval(updateDashboardData, 5000);
    });

    function updateTime() {
      const now = new Date();
      const options = { 
        hour: '2-digit', 
        minute: '2-digit', 
        second: '2-digit',
        hour12: true 
      };
      document.getElementById('update-time').textContent = now.toLocaleTimeString('en-US', options);
    }

    function updateDashboardData() {
      // Mock data - in a real app, this would come from an API
      const mockData = {
        users: Math.floor(Math.random() * 1000) + 2500,
        sales: Math.floor(Math.random() * 500) + 1000,
        revenue: '$' + (Math.random() * 50000 + 20000).toFixed(2),
        activities: [
          { 
            icon: 'user-plus',
            text: 'New user registered',
            time: `${Math.floor(Math.random() * 10) + 1} min ago`
          },
          { 
            icon: 'shopping-cart',
            text: 'New order completed',
            time: `${Math.floor(Math.random() * 30) + 10} min ago`
          },
          { 
            icon: 'bell',
            text: 'System notification',
            time: `${Math.floor(Math.random() * 60) + 30} min ago`
          }
        ]
      };

      // Update stats
      document.getElementById('user-count').textContent = mockData.users.toLocaleString();
      document.getElementById('sales-count').textContent = mockData.sales.toLocaleString();
      document.getElementById('revenue-amount').textContent = mockData.revenue;

      // Update activities
      const activitiesList = document.getElementById('activities-list');
      activitiesList.innerHTML = '';
      
      mockData.activities.forEach(activity => {
        const li = document.createElement('li');
        li.innerHTML = `
          <i class="fas fa-${activity.icon}"></i>
          <div>
            <p>${activity.text}</p>
            <small>${activity.time}</small>
          </div>
        `;
        activitiesList.appendChild(li);
      });
    }
  </script>
</body>
</html>
